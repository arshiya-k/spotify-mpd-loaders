# Airflow 3 with CeleryExecutor. Run from the repo root:
#   docker compose -f loaders/06_airflow/docker-compose.airflow.yml up -d
#
# Trimmed from the official compose: one worker, no Flower, no example DAGs.
# Airflow's own metadata lives in its own Postgres (airflow-db) -- never the data DB.
# The worker reaches the NATIVE data Postgres via host.docker.internal:5433.

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.1-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://mpd-redis:6379/1
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: mpd-dev-secret-not-for-prod
    AIRFLOW__CORE__MAX_MAP_LENGTH: "2048"          # default 1024; we map over up to 1000 slices
    # our code's config
    MPD_DATA_DIR: /data
    DATABASE_URL: postgresql://mpd@host.docker.internal:5433/mpd
    PYTHONPATH: /opt/mpd
    _PIP_ADDITIONAL_REQUIREMENTS: "psycopg[binary]>=3.2 python-dotenv"
  volumes:
    - ./dags:/opt/airflow/dags
    - ../../common:/opt/mpd/common:ro           # our shared parse/copy/db code
    - ../../schema:/opt/mpd/schema:ro
    - ${MPD_DATA_DIR}:/data:ro
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com || true

  airflow-apiserver:
    <<: *airflow-common
    container_name: airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    container_name: airflow-dag-processor
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: airflow-worker
    command: celery worker
    environment:
      <<: *airflow-env
      AIRFLOW__CELERY__WORKER_CONCURRENCY: "8"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:

networks:
  default:
    name: spotify-mpd-loaders_default    # join the base compose network so mpd-redis resolves
    external: true
